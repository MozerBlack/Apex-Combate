<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Combate — Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <!-- HEADER -->
  <header class="login-header">
    <a href="index.html" class="login-header-logo">
      <span class="header-logo-text">APEX <span>COMBATE</span></span>
    </a>

    <nav class="login-nav">
      <a href="placar.html">PLACAR</a>
      <a href="perfil.html">ATLETA</a>
      <a href="dashboard.html">DASHBOARD</a>
      <a href="#">EVENTOS</a>
      <a href="#">SOBRE</a>
    </nav>

    <div class="login-header-actions">
      <button class="btn-menu-icon" aria-label="Menu">☰</button>
      <a href="#login-card" class="btn-login-header">LOGIN</a>
    </div>
  </header>

  <!-- DECORATIVE RED SHAPES -->
  <div class="deco-shape deco-left"></div>
  <div class="deco-shape deco-right"></div>

  <!-- MAIN -->
  <main class="login-main">
    <div class="login-card" id="login-card">

      <!-- LOGO OFICIAL (imagem) -->
      <div class="login-logo">
        <img src="logo-apex-combate.svg" alt="Apex Combate" class="logo-img-oficial">
        <p class="login-card-label">LOGIN-CARD</p>
      </div>

      <p class="login-escolha">ESCOLHA O TIPO DE LOGIN: ATLETA / CLUBE / FEDERAÇÃO</p>

      <!-- 3 OPÇÕES -->
      <div class="login-options" id="login-options">
        <button type="button" class="login-option" data-tipo="atleta" id="opt-atleta">
          <span class="option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
          <span class="option-label">ATLETA</span>
        </button>

        <button type="button" class="login-option" data-tipo="clube" id="opt-clube">
          <span class="option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></svg>
          </span>
          <span class="option-label">CLUBE</span>
        </button>

        <button type="button" class="login-option" data-tipo="federacao" id="opt-federacao">
          <span class="option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
          </span>
          <span class="option-label">FEDERAÇÃO</span>
        </button>
      </div>

      <!-- BOTÃO VERMELHO PRINCIPAL -->
      <button type="button" class="btn-entrar-principal" id="btn-entrar" disabled>
        ENTRAR
      </button>

      <!-- FORMULÁRIOS -->
      <div id="area-formularios" class="hidden">
        
        <form id="form-atleta" class="login-form hidden">
          <div class="input-group">
            <label for="cpf">CPF do Atleta</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required autocomplete="off">
          </div>
          <div class="input-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
          </div>
          <button type="submit" class="btn-entrar-principal">CONFIRMAR LOGIN</button>
          <button type="button" class="btn-voltar" data-back>← Voltar</button>
        </form>

        <form id="form-clube" class="login-form hidden">
          <div class="input-group">
            <label for="email-clube">E-mail do Clube / Dojo</label>
            <input type="email" id="email-clube" name="email" placeholder="contato@seudjo.com" required>
          </div>
          <div class="input-group">
            <label for="senha-clube">Senha</label>
            <input type="password" id="senha-clube" name="senha" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-entrar-principal">CONFIRMAR LOGIN</button>
          <button type="button" class="btn-voltar" data-back>← Voltar</button>
        </form>

        <form id="form-federacao" class="login-form hidden">
          <div class="input-group">
            <label for="email-fed">E-mail da Federação</label>
            <input type="email" id="email-fed" name="email" placeholder="admin@federacao.org.br" required>
          </div>
          <div class="input-group">
            <label for="senha-fed">Senha</label>
            <input type="password" id="senha-fed" name="senha" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-entrar-principal">CONFIRMAR LOGIN</button>
          <button type="button" class="btn-voltar" data-back>← Voltar</button>
        </form>
      </div>

      <div class="login-card-footer">
        <span>Acesso seguro</span>
        <span>•</span>
        <span>Apex Combate 2026</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const options = document.querySelectorAll('.login-option');
      const optionsBox = document.getElementById('login-options');
      const btnEntrar = document.getElementById('btn-entrar');
      const areaForms = document.getElementById('area-formularios');
      const escolha = document.querySelector('.login-escolha');
      const forms = {
        atleta: document.getElementById('form-atleta'),
        clube: document.getElementById('form-clube'),
        federacao: document.getElementById('form-federacao')
      };
      let tipoSelecionado = null;

      options.forEach(opt => {
        opt.addEventListener('click', () => {
          options.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          tipoSelecionado = opt.dataset.tipo;
          btnEntrar.disabled = false;
        });
      });

      btnEntrar.addEventListener('click', () => {
        if (!tipoSelecionado) return;
        optionsBox.classList.add('hidden');
        btnEntrar.classList.add('hidden');
        if (escolha) escolha.classList.add('hidden');
        areaForms.classList.remove('hidden');
        Object.values(forms).forEach(f => f.classList.add('hidden'));
        if (forms[tipoSelecionado]) forms[tipoSelecionado].classList.remove('hidden');
      });

      document.querySelectorAll('[data-back]').forEach(btn => {
        btn.addEventListener('click', () => {
          areaForms.classList.add('hidden');
          Object.values(forms).forEach(f => f.classList.add('hidden'));
          optionsBox.classList.remove('hidden');
          btnEntrar.classList.remove('hidden');
          if (escolha) escolha.classList.remove('hidden');
        });
      });

      const formAtleta = document.getElementById('form-atleta');
      if (formAtleta) {
        formAtleta.addEventListener('submit', async (e) => {
          e.preventDefault();
          const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
          const dataNascimento = document.getElementById('data_nascimento').value;
          if (cpf.length !== 11) { alert('CPF inválido.'); return; }
          if (!dataNascimento) { alert('Informe a data de nascimento.'); return; }

          try {
            const response = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cpf, data_nascimento: dataNascimento })
            });
            const data = await response.json();
            if (response.ok) {
              localStorage.setItem('apex_atleta', JSON.stringify(data.usuario));
              window.location.href = 'perfil.html';
            } else {
              alert(data.error || 'Dados incorretos.');
            }
          } catch (err) {
            localStorage.setItem('apex_atleta', JSON.stringify({ cpf, data_nascimento: dataNascimento }));
            window.location.href = 'perfil.html';
          }
        });
      }

      ['form-clube', 'form-federacao'].forEach(id => {
        const f = document.getElementById(id);
        if (f) f.addEventListener('submit', e => {
          e.preventDefault();
          alert('Login de Clube/Federação em desenvolvimento.\nUse o acesso de Atleta por enquanto.');
        });
      });
    });
  </script>
</body>
</html>
